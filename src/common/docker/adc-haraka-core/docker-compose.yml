services:
  haraka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adc-haraka-core
    # `NET_BIND_SERVICE` NO es opcional acá y es la trampa de este archivo: la imagen ya corre como
    # el usuario `node` y consigue el puerto 25 por un `setcap` sobre el binario (ver Dockerfile).
    # Una capability de archivo sólo se puede activar si además está en el *bounding set* del
    # contenedor, así que un `cap_drop: ALL` pelado dejaría al MTA sin poder abrir el 25 —y el
    # síntoma sería un healthcheck que nunca pasa, no un error que nombre las capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 512
    ports:
      # 25: SMTP entrante y, mientras el envío sea interno, también la entrega
      # del email-service (por 25 el correo local va al webhook, no a internet).
      # Loopback por defecto: así el MTA sólo recibe la entrega interna. Para
      # RECIBIR de fuera hay que publicarlo en la interfaz pública
      # (`MAIL_BIND_HOST=0.0.0.0`), y eso expone el 25 a internet — prerequisitos
      # (TLS + límites con Redis) en docs/guides/email-dns-setup.md.
      - "${MAIL_BIND_HOST:-127.0.0.1}:25:25"
      # 587 (submission) no se publica ni se escucha hasta abrir el envío
      # externo: hoy sería un segundo 25 sin AUTH, superficie gratis. Al
      # habilitarlo: restaurar el listener en config/smtp.ini + auth + TLS.
    environment:
      # Hostname público del MTA (debe coincidir con el registro A y el PTR)
      HARAKA_ME: ${MAIL_HOSTNAME:-mail.adigitalcafe.com}
      # Dominio raíz de correo; se aceptan subdominios *.<MAIL_ROOT_DOMAIN>
      MAIL_ROOT_DOMAIN: ${MAIL_ROOT_DOMAIN:-adigitalcafe.com}
      # Webhook del email-service para entregar correo entrante
      INBOUND_WEBHOOK_URL: ${MAIL_INBOUND_WEBHOOK_URL:-http://host.docker.internal:3000/api/email/inbound}
      INBOUND_WEBHOOK_SECRET: ${MAIL_INBOUND_WEBHOOK_SECRET:-change-me}
      # DKIM selector global
      DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-adcmail}
      # Redis para los topes de rate del plugin `limit` (config/limit.ini). Nombre de contenedor,
      # resuelto por el DNS de la red compartida `adc-core-net`: NO se pasa por el host, así que el
      # 6380 sigue publicado sólo en loopback. Si no contesta, el plugin degrada a permitir
      # (`if (!this.db) return next()`): sin Redis se pierden los topes, no el correo.
      REDIS_HOST: ${MAIL_REDIS_HOST:-adc-redis-core}
      REDIS_PORT: ${MAIL_REDIS_PORT:-6379}
      # Identidad propia del MTA, no la de la plataforma: la ACL que la acota vive en el compose de
      # adc-redis-core y sólo le deja sus claves de rate. El default acompaña al de allá para que un
      # despliegue sin configurar arranque igual; en un nodo real las dos salen de `env/secrets.env`.
      REDIS_USER: ${MAIL_REDIS_USER:-haraka}
      REDIS_PASSWORD: ${MAIL_REDIS_PASSWORD:-change-me-haraka}
    volumes:
      # Clave privada DKIM (gitignorada): openssl genrsa -out ./dkim/private 2048
      # La pública (openssl rsa -in private -pubout) va en el TXT: adcmail._domainkey.<dominio>.
      # Se monta como secreto y el entrypoint la copia al layout config/dkim/<dominio>/
      # que espera el plugin (necesita escribir ahí el archivo `selector`).
      - ./dkim:/app/secrets/dkim:ro
      # Certificado STARTTLS (opcional, gitignorado): cert.pem + key.pem (con
      # Let's Encrypt: fullchain.pem y privkey.pem renombrados). Si faltan, el
      # entrypoint arranca sin TLS; es prerequisito para exponer el 25.
      - ./tls:/app/secrets/tls:ro
      - adc_haraka_queue:/app/queue
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Probe con `node` porque la imagen no trae `nc` ni `curl` (sólo ca-certificates
      # y libcap), y comprueba el listener SMTP en sí, que es lo que importa: el
      # proceso puede estar vivo con el 25 todavía cerrado.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(25,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Igual que rabbit/redis: sin start_interval el primer chequeo espera el `interval`
      # entero y el arranque en frío reporta healthy ~10 s tarde sin motivo.
      start_period: 30s
      start_interval: 500ms
    # Deja terminar las entregas en vuelo antes de cortar. Un SMTP matado a mitad de una sesión
    # obliga al remitente a reintentar; lo que está en la cola sobrevive en su volumen, pero el
    # mensaje que se estaba entregando se pierde el intento.
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      # Retención local acotada: sin esto el json-file default crece sin tope.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - adc-network
      # Sólo para llegar al Redis de los topes de rate (ver REDIS_HOST arriba).
      - adc-core-net

volumes:
  adc_haraka_queue:

networks:
  adc-network:
    driver: bridge
  # `external`: la crea el kernel antes de levantar los comunes (DockerManager.#ensureSharedNetwork),
  # porque arrancan en paralelo y el que la declarara podría crearla después de que el otro intente
  # unirse. Suelto: `docker network create adc-core-net`.
  adc-core-net:
    external: true
