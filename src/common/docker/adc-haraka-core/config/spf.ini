; SPF del correo ENTRANTE (haraka-plugin-spf, bundleado con Haraka 3.2).
; No confundir con el TXT SPF publicado en DNS, que autoriza nuestro envío.
;
; Modo anotación: evalúa y agrega Received-SPF / resultados a la transacción,
; pero no rechaza nada (todos los deny en false, que además es el default).
; Las IPs privadas se saltean automáticamente, así que el tráfico interno del
; email-service (red docker) jamás se evalúa. Endurecer (deny.mfrom_fail=true)
; recién tras revisar logs un tiempo con el puerto 25 expuesto: un deny
; prematuro rebota correo legítimo de dominios con SPF mal mantenido.

[deny]
helo_none=false
helo_softfail=false
helo_fail=false
helo_permerror=false
mfrom_none=false
mfrom_softfail=false
mfrom_fail=false
mfrom_permerror=false
