; Config de conexión de Haraka. Este archivo REEMPLAZA al de la distribución
; (no se fusionan), y `connection.js` desreferencia cada sección sin comprobar
; que exista: si falta alguna, el proceso crashea. Con `[message]` ausente el
; MTA moría con "Cannot read properties of undefined (reading 'greeting')" en
; cada conexión entrante. Deben estar las seis: main, haproxy, headers, max,
; message y uuid.
[main]
smtputf8=true

[haproxy]
; Sin proxies PROXY-protocol delante del MTA.
hosts[] =

[headers]
add_received=true
show_version=true
clean_auth_results=true
max_lines=1000
max_received=100

[max]
; Tamaño máximo de mensaje (50 MB) — antes era `databytes` en smtp.ini, que
; Haraka >= 3.2 ya no lee. El límite real por tier lo aplica el email-service.
bytes=52428800
mime_parts=1000
line_length=512
data_line_length=992

[message]
helo=Haraka is at your service.
close=closing connection. Have a jolly good day.

[uuid]
banner_chars=6
deny_chars=0
