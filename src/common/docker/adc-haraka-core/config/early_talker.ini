; Rechaza clientes que mandan comandos antes de recibir el banner SMTP: los
; servidores legítimos esperan siempre; los bots de spam hablan de entrada para
; ganar velocidad. El plugin saltea solo conexiones locales, privadas (red
; docker: el email-service nunca sufre la pausa), relaying y la whitelist.

; Segundos de demora del banner para conexiones no exentas.
pause=3

; reject=true (default): desconecta con DENYDISCONNECT al que habló antes.

[ip_whitelist]
::1
127.0.0.1
