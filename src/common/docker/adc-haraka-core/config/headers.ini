; Overrides de `haraka-plugin-headers` (el plugin que carga `data.headers`).
; Sólo hace falta declarar lo que se cambia: para los plugins-paquete Haraka
; fusiona el ini del propio plugin con este.
[check]
; `from_phish` está roto en la versión que trae Haraka 3.2.1: revienta con
; "parsed_from[0].address is not a function" y, como el hook nunca llama a
; next(), la sesión SMTP se queda colgada en DATA y no se entrega ningún correo.
from_phish=false
