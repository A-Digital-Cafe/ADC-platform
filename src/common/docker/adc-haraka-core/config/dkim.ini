; Config de `haraka-plugin-dkim` (el core de Haraka 3.2 ya no trae `dkim_sign`).
;
; FIRMADO SALIENTE
; La clave privada se monta desde el host y el entrypoint la copia a
;   /app/config/dkim/<MAIL_ROOT_DOMAIN>/private
;   /app/config/dkim/<MAIL_ROOT_DOMAIN>/selector
; El plugin busca el directorio más específico subiendo por la jerarquía de
; labels y firma con `d=` = nombre del directorio encontrado. Con un único
; directorio en el dominio raíz, el correo de `usuario@<org>.<raíz>` se firma
; igual con `d=<raíz>`: un solo registro DNS cubre todos los subdominios y
; DMARC valida por alineación relajada (adkim=r, el default).
;
; Genera el par: openssl genrsa -out private 2048
;                openssl rsa -in private -pubout -out public.pem
; Publica en: <selector>._domainkey.<raíz> TXT "v=DKIM1; k=rsa; p=<base64>"
[sign]
enabled = true
headers = From, Sender, Reply-To, Subject, Date, Message-ID, To, Cc, MIME-Version

[canon]
; `relaxed` tolera los reflows de espacios que aplican los MTA intermedios;
; con `simple` cualquier retoque del cuerpo invalida la firma.
body = relaxed

; VERIFICACIÓN ENTRANTE: anota el resultado DKIM del correo recibido de fuera.
[verify]
enabled = true
