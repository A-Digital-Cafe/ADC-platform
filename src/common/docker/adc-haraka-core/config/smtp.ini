; Configuración del listener SMTP de Haraka.
; Sólo el 25: recepción externa y, mientras el envío sea interno, también la
; entrega del email-service. El 587 (submission) se habilita recién al abrir el
; envío externo, junto con auth/flat_file y TLS (ver comentario en `plugins`).
listen=0.0.0.0:25

; El tamaño máximo de mensaje vive en connection.ini [max] bytes — el viejo
; `databytes` de este archivo no se lee desde Haraka 3.2.
