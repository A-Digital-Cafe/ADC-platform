; STARTTLS (plugin `tls` del core). El plugin sólo se carga si el entrypoint
; encontró certificado montado en /app/secrets/tls (lo copia acá al lado como
; tls_cert.pem / tls_key.pem, los paths por defecto de este ini).
;
; El cert debe cubrir el hostname del MTA (MAIL_HOSTNAME, p. ej. con Let's
; Encrypt: fullchain.pem → tls_cert.pem, privkey.pem → tls_key.pem). La
; renovación requiere reiniciar el contenedor (deploy-hook de certbot).
key=tls_key.pem
cert=tls_cert.pem
