; Topes anti-abuso por sesión (haraka-plugin-limit, bundleado con Haraka 3.2).
;
; Sólo están activas las secciones que funcionan EN MEMORIA por conexión:
; errors, recipients y unrecognized_commands. Las de concurrencia y de rate
; (rate_conn, rate_rcpt_*, outbound) necesitan Redis, y el contenedor no llega
; al Redis de la plataforma (compose aparte = red bridge aparte; además publica
; sólo en 127.0.0.1 del host, inalcanzable vía host.docker.internal). Al exponer
; el 25 a internet, activarlas junto con un Redis alcanzable ([redis] host/port).
;
; OJO: no escribir `enabled=false` en [concurrency] — esa clave no está
; declarada como booleana en el plugin y el string "false" es truthy: activaría
; la sección (que exige Redis). Las secciones apagadas van comentadas enteras.

[errors]
; Corta la sesión tras N comandos erróneos (sintaxis inválida, secuencias mal).
enabled=true
max=10

[recipients]
; Tope de RCPT TO por conexión: es lo que frena la enumeración de casillas por
; diccionario. El tier más alto del email-service permite 20 destinatarios por
; mensaje, así que 25 da margen sin molestar al tráfico interno.
enabled=true
max=25

[unrecognized_commands]
enabled=true
max=10

; --- Secciones que requieren Redis: dejar comentadas hasta tener uno ---
; [redis]
; host=...
; port=6379
; database=4
;
; [concurrency]
; enabled=true
; max=5
;
; [rate_conn]
; enabled=true
; default=30
; 10=0
; 172=0
; 192.168=0
;
; [rate_rcpt_host]
; enabled=true
; default=50/5m
; 10=0
; 172=0
; 192.168=0
