; Topes anti-abuso (haraka-plugin-limit, bundleado con Haraka 3.2).
;
; Dos familias. Las de MEMORIA (errors, recipients, unrecognized_commands) cuentan
; dentro de una conexión y frenan a quien insiste en una sola sesión. Las de RATE
; (rate_conn, rate_rcpt_*, concurrency) cuentan por IP A LO LARGO DEL TIEMPO, que es
; lo único que frena la enumeración de casillas: abrir mil sesiones cortas probando
; direcciones distintas pasa entera por debajo de los topes por sesión.
;
; Las de rate necesitan Redis porque el contador tiene que sobrevivir a la conexión.
; La conexión la configura el entrypoint en redis.ini (contenedor `adc-redis-core`
; por la red compartida `adc-core-net`); acá va sólo la política. Si Redis no
; contesta, el plugin degrada a permitir (`if (!this.db) return next()`): se pierden
; los topes, no el correo.
;
; OJO: no escribir `enabled=false` en [concurrency] — esa clave no está declarada
; como booleana en el plugin y el string "false" es truthy, así que "false" la
; ACTIVA. Las secciones apagadas van comentadas enteras.

[errors]
; Corta la sesión tras N comandos erróneos (sintaxis inválida, secuencias mal).
enabled=true
max=10

[recipients]
; Tope de RCPT TO por conexión: es lo que frena la enumeración de casillas por
; diccionario. El tier más alto del email-service permite 20 destinatarios por
; mensaje, así que 25 da margen sin molestar al tráfico interno.
enabled=true
max=25

[unrecognized_commands]
enabled=true
max=10

; --- Topes por IP en el tiempo (requieren Redis; ver cabecera) ---

[redis]
; Sólo la base: host y puerto los pone el entrypoint en redis.ini. La 4 es la del
; ejemplo del plugin y no la usa nadie más de la plataforma.
database=4

; [concurrency] queda APAGADA a propósito, y es la asimetría interesante de este archivo:
; es la única sección sin exención por IP (`get_limit` lee un `max` global, sin la tabla
; de prefijos que sí tienen las de rate). Con ella encendida, una ráfaga de entrega
; interna del email-service —que entra por la red docker como cualquier otro cliente—
; se comería un DENYSOFT + tarpit. Aporta poco sobre rate_conn y puede tempfailear
; correo propio, así que no va. Comentada entera: `enabled=false` la ACTIVARÍA (ver arriba).

[rate_conn]
; Conexiones por IP por minuto. Las privadas en 0 (= sin límite) para no tocar la
; entrega interna del email-service, que entra por la red docker.
enabled=true
default=30
10=0
172=0
192.168=0
127=0

[rate_rcpt_host]
; Destinatarios por IP en una ventana: ES el tope anti-enumeración. Con 50/5m, probar
; un diccionario de mil direcciones lleva casi dos horas y se ve en los logs.
enabled=true
default=50/5m
10=0
172=0
192.168=0
127=0
