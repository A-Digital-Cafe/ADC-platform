services:
  redis:
    image: redis:alpine
    container_name: adc-redis-core
    ports:
      - "127.0.0.1:6380:6379"
    # `requirepass ""` es "sin contraseña" para Redis: sin REDIS_PASSWORD no hay auth.
    # Es defensa en profundidad: lo que realmente protege los secretos de sesión es que
    # van cifrados (ver `at-rest-envelope`), porque el bind a loopback no ayuda contra
    # nada que ya corra en el host.
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - adc_redis_core_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      # start_period/start_interval: sin esto el PRIMER chequeo recién corre
      # a los `interval` (10 s), así que un arranque en frío tarda ~11 s en
      # reportarse healthy aunque el servicio esté listo en ~1 s.
      start_period: 30s
      start_interval: 500ms
    networks:
      - adc-network

volumes:
  adc_redis_core_data:

networks:
  adc-network:
    driver: bridge
