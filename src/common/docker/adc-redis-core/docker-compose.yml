services:
  redis:
    # Versión explícita + digest. El tag `alpine` a secas era peor de lo que parece: `compose up -d`
    # NO re-baja una imagen que ya existe local, así que el motor se quedaba clavado en la build del
    # primer arranque (acá: 8.4.0, de nueve meses atrás) y ninguna corrección posterior llegaba
    # nunca. Con el digest, un `up` contra una imagen distinta la baja sola.
    image: redis:8.4.5-alpine@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
    container_name: adc-redis-core
    ports:
      # Loopback por defecto. Se abre a la dirección de la red privada (`REDIS_BIND_HOST=<ip de
      # overlay>`) sólo en el nodo que hace de master, porque es la única forma de que la réplica de
      # otro nodo lo alcance. Nunca a `0.0.0.0`: sin `REDIS_PASSWORD`, Redis no pide autenticación.
      - "${REDIS_BIND_HOST:-127.0.0.1}:6380:6379"
    # Un proceso que sólo tiene que leer y escribir su propio volumen no necesita ninguna capability
    # del set default de docker. `no-new-privileges` corta además el escalón por binarios setuid.
    # Las cuatro que quedan son del entrypoint oficial, que arranca como root, hace `chown` de /data
    # y recién ahí baja a `redis` con su-exec.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 512
    # `requirepass ""` es "sin contraseña" para Redis: sin REDIS_PASSWORD no hay auth.
    # Es defensa en profundidad: lo que realmente protege los secretos de sesión es que
    # van cifrados (ver `at-rest-envelope`), porque el bind a loopback no ayuda contra
    # nada que ya corra en el host.
    #
    # `--replicaof no one` es "sos el master", y es el default a propósito: un nodo suelto tiene que
    # seguir levantando su Redis sin configurar nada. Poniendo `REDIS_REPLICA_OF="<host> <puerto>"`
    # el mismo contenedor arranca como réplica de ese master —de sólo lectura, sincronizando— sin
    # tocar el compose. `--masterauth` va siempre porque en un master no hace nada, y omitirlo sería
    # el error silencioso clásico: la réplica conecta, el master le pide auth y la sincronización
    # falla en bucle sin que el contenedor deje de estar "healthy".
    #
    # El `--user haraka` es una identidad APARTE para el MTA, que es el proceso más expuesto del
    # despliegue (habla con cualquiera en internet, sin autenticar, parseando MIME). Sólo puede tocar
    # las claves de sus contadores de rate y sólo con los comandos que usa `haraka-plugin-limit`
    # (+ los del handshake de node-redis: select/info/ping/client|setinfo), así que un RCE en Haraka
    # no llega a las sesiones ni a los leases de líder.
    #
    # ⚠️ Esto SÓLO sirve con `REDIS_PASSWORD` puesta. Sin ella el usuario `default` queda `nopass` y
    # quien esté adentro del contenedor de Haraka se conecta como default y se saltea la ACL entera.
    # Las dos variables van juntas o el usuario acotado es decorativo.
    #
    # Los patrones de clave NO se pueden acotar por base: las ACL de Redis ignoran el `SELECT`. Que
    # el prefijo sea el candado es lo que hace que `database=4` sea sólo prolijidad y no seguridad.
    command:
      redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}" --masterauth "${REDIS_PASSWORD:-}" --replicaof ${REDIS_REPLICA_OF:-no one}
      --user "haraka" on ">${MAIL_REDIS_PASSWORD:-change-me-haraka}" "~rate_conn:*" "~rate_rcpt_host:*" resetchannels
      +select +info +ping "+client|setinfo" +incr +expire +get +hincrby +hgetall +hdel
    # Con `appendonly yes`, el SIGTERM dispara el fsync final del AOF. El default de docker son
    # 10 s: alcanzan salvo con un AOF grande, y si no alcanzan se pierden las últimas escrituras
    # (leases, rate limit, estado de sesión) sin que nada avise.
    stop_grace_period: 30s
    # Sin esto, un Redis caído se lleva puesto el rate limit, los leases de líder y las afinidades de
    # conexión hasta que alguien reinicie la plataforma: el kernel levanta los composes sólo al
    # arrancar. `unless-stopped` respeta el parate manual, que es lo que hace falta al promover una
    # réplica a master.
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - adc_redis_core_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      # start_period/start_interval: sin esto el PRIMER chequeo recién corre
      # a los `interval` (10 s), así que un arranque en frío tarda ~11 s en
      # reportarse healthy aunque el servicio esté listo en ~1 s.
      start_period: 30s
      start_interval: 500ms
    networks:
      - adc-network
      # Red compartida con los stacks que necesitan hablarle sin pasar por el host: hoy el MTA, que
      # usa Redis para los topes de rate del 25 (los contadores tienen que sobrevivir a la sesión).
      # Por acá el acceso es de contenedor a contenedor, así que no hace falta publicar el 6380 en
      # ninguna interfaz más — que es justo lo que este compose evita por no tener contraseña.
      - adc-core-net

volumes:
  adc_redis_core_data:

networks:
  adc-network:
    driver: bridge
  # `external`: la crea el kernel antes de levantar los comunes (DockerManager.#ensureSharedNetwork).
  # Los comunes arrancan en paralelo, así que si la declarara un compose el otro fallaría a veces
  # al unirse a una red que todavía no existe. Suelto: `docker network create adc-core-net`.
  adc-core-net:
    external: true
